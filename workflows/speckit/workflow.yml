schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Canonical Documentary SDD Chain"
  version: "2.0.0"
  author: "GitHub"
  description: "Runs constitution → specify → clarify → plan → tasks → analyze"

requires:
  speckit_version: ">=0.16.4"
  integrations:
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "hermes"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  constitution:
    type: string
    required: false
    default: ""
    prompt: "Optional constitution guidance"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; 'auto' uses the project's initialized integration"

steps:
  - id: constitution
    command: speckit.constitution
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.constitution }}"

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
